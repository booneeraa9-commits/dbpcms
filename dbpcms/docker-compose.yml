version: '3.9'

# This docker-compose is for LOCAL DEVELOPMENT only.
# For production deployment, see docs/deployment.md

services:
  # ──────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dbpcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbpcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbpcms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dbpcms}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dbpcms} -d ${POSTGRES_DB:-dbpcms}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────
  # Backend API
  # ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: dbpcms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-dbpcms}:${POSTGRES_PASSWORD:-dbpcms_dev_password}@postgres:5432/${POSTGRES_DB:-dbpcms}
      PORT: 4000
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - api_node_modules:/app/apps/api/node_modules
    command: npm run dev:api

  # ──────────────────────────────────────────────────────
  # Frontend Web App
  # ──────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: dbpcms-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - web_node_modules:/app/apps/web/node_modules
    command: npm run dev:web

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
