<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="900" fill="#f8fafc"/>
  <text x="590" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">DBPCMS — Entity Relationship Overview (Version 1)</text>
  <text x="590" y="60" text-anchor="middle" font-size="13" fill="#64748b">Simplified: key tables and how they connect. Each box = a table. Arrows point from "many" to "one".</text>

  <!-- Legend -->
  <rect x="24" y="80" width="14" height="14" rx="3" fill="#6366f1"/><text x="44" y="92" font-size="12" fill="#334155">Identity &amp; Access</text>
  <rect x="200" y="80" width="14" height="14" rx="3" fill="#0ea5e9"/><text x="220" y="92" font-size="12" fill="#334155">Academic Structure</text>
  <rect x="380" y="80" width="14" height="14" rx="3" fill="#16a34a"/><text x="400" y="92" font-size="12" fill="#334155">Employees</text>
  <rect x="520" y="80" width="14" height="14" rx="3" fill="#d97706"/><text x="540" y="92" font-size="12" fill="#334155">Students &amp; Grading</text>
  <rect x="700" y="80" width="14" height="14" rx="3" fill="#64748b"/><text x="720" y="92" font-size="12" fill="#334155">Platform / cross-cutting</text>

  <!-- helper styles via inline attrs -->
  <!-- IDENTITY -->
  <g>
    <rect x="40" y="130" width="150" height="66" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="115" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">users</text>
    <text x="115" y="170" text-anchor="middle" font-size="10" fill="#475569">email, password_hash</text>
    <text x="115" y="184" text-anchor="middle" font-size="10" fill="#475569">lockout, token_version</text>
  </g>
  <g>
    <rect x="40" y="230" width="150" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="115" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">roles</text>
    <text x="115" y="270" text-anchor="middle" font-size="10" fill="#475569">name, is_system</text>
  </g>
  <g>
    <rect x="40" y="316" width="150" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="115" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">permissions</text>
    <text x="115" y="356" text-anchor="middle" font-size="10" fill="#475569">key (grade:approve)</text>
  </g>
  <g>
    <rect x="40" y="404" width="150" height="46" rx="8" fill="#f5f3ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="115" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">user_roles</text>
    <text x="115" y="440" text-anchor="middle" font-size="9" fill="#64748b">join</text>
  </g>
  <g>
    <rect x="40" y="470" width="150" height="46" rx="8" fill="#f5f3ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="115" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">role_permissions</text>
    <text x="115" y="506" text-anchor="middle" font-size="9" fill="#64748b">join</text>
  </g>
  <g>
    <rect x="40" y="536" width="150" height="46" rx="8" fill="#f5f3ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="115" y="556" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">refresh_tokens</text>
    <text x="115" y="572" text-anchor="middle" font-size="9" fill="#64748b">sessions</text>
  </g>

  <!-- ACADEMIC -->
  <g>
    <rect x="250" y="130" width="160" height="60" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">departments</text>
    <text x="330" y="172" text-anchor="middle" font-size="10" fill="#475569">name, code, head</text>
  </g>
  <g>
    <rect x="250" y="222" width="160" height="52" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">programs</text>
    <text x="330" y="262" text-anchor="middle" font-size="10" fill="#475569">degree_level</text>
  </g>
  <g>
    <rect x="250" y="306" width="160" height="52" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">courses</text>
    <text x="330" y="346" text-anchor="middle" font-size="10" fill="#475569">code, credit_hours</text>
  </g>
  <g>
    <rect x="250" y="390" width="160" height="52" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">academic_years</text>
    <text x="330" y="430" text-anchor="middle" font-size="10" fill="#475569">is_current</text>
  </g>
  <g>
    <rect x="250" y="474" width="160" height="52" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">semesters</text>
    <text x="330" y="514" text-anchor="middle" font-size="10" fill="#475569">status</text>
  </g>
  <g>
    <rect x="250" y="558" width="160" height="58" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="580" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">sections</text>
    <text x="330" y="598" text-anchor="middle" font-size="10" fill="#475569">course × semester</text>
  </g>
  <g>
    <rect x="250" y="648" width="160" height="56" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="330" y="670" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">instructor_assignments</text>
    <text x="330" y="688" text-anchor="middle" font-size="10" fill="#475569">instructor × section</text>
  </g>

  <!-- EMPLOYEES -->
  <g>
    <rect x="470" y="130" width="170" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="555" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">employees</text>
    <text x="555" y="170" text-anchor="middle" font-size="10" fill="#475569">employee_number</text>
    <text x="555" y="184" text-anchor="middle" font-size="10" fill="#475569">personal + employment</text>
    <text x="555" y="197" text-anchor="middle" font-size="9" fill="#94a3b8">(national_id encrypted)</text>
  </g>
  <g>
    <rect x="470" y="228" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="555" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">employee_education</text>
  </g>
  <g>
    <rect x="470" y="288" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="555" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">employee_qualifications</text>
  </g>
  <g>
    <rect x="470" y="348" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="555" y="375" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">employment_history</text>
  </g>
  <g>
    <rect x="470" y="408" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="555" y="435" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">emergency_contacts</text>
  </g>

  <!-- STUDENTS & GRADING -->
  <g>
    <rect x="690" y="130" width="170" height="58" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">students</text>
    <text x="775" y="172" text-anchor="middle" font-size="10" fill="#475569">student_number, status</text>
  </g>
  <g>
    <rect x="690" y="212" width="170" height="52" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">enrollments</text>
    <text x="775" y="252" text-anchor="middle" font-size="10" fill="#475569">student × section</text>
  </g>
  <g>
    <rect x="690" y="288" width="170" height="52" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="310" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">grade_entries</text>
    <text x="775" y="328" text-anchor="middle" font-size="10" fill="#475569">per component score</text>
  </g>
  <g>
    <rect x="690" y="364" width="170" height="60" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">grade_results</text>
    <text x="775" y="404" text-anchor="middle" font-size="10" fill="#475569">GPA, letter, is_pass</text>
    <text x="775" y="417" text-anchor="middle" font-size="9" fill="#94a3b8">+ frozen snapshot</text>
  </g>
  <g>
    <rect x="690" y="448" width="170" height="58" rx="8" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
    <text x="775" y="470" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">grade_submissions</text>
    <text x="775" y="488" text-anchor="middle" font-size="10" fill="#475569">workflow + locking</text>
  </g>
  <g>
    <rect x="690" y="530" width="170" height="46" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="775" y="550" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">grade_components</text>
    <text x="775" y="566" text-anchor="middle" font-size="9" fill="#64748b">configurable, weighted</text>
  </g>
  <g>
    <rect x="690" y="588" width="170" height="46" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="775" y="608" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">grading_scales</text>
    <text x="775" y="624" text-anchor="middle" font-size="9" fill="#64748b">configurable, versioned</text>
  </g>
  <g>
    <rect x="690" y="646" width="170" height="46" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="775" y="666" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">gpa_rules</text>
    <text x="775" y="682" text-anchor="middle" font-size="9" fill="#64748b">4.0 / 5.0 / custom</text>
  </g>

  <!-- PLATFORM -->
  <g>
    <rect x="920" y="130" width="200" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1020" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">audit_logs</text>
    <text x="1020" y="170" text-anchor="middle" font-size="10" fill="#475569">who, action, before/after</text>
    <text x="1020" y="184" text-anchor="middle" font-size="10" fill="#475569">timestamp, ip (append-only)</text>
  </g>
  <g>
    <rect x="920" y="228" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1020" y="250" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">documents</text>
    <text x="1020" y="268" text-anchor="middle" font-size="10" fill="#475569">storage_key (swappable)</text>
  </g>
  <g>
    <rect x="920" y="308" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1020" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">notifications</text>
    <text x="1020" y="348" text-anchor="middle" font-size="10" fill="#475569">in-app now, email later</text>
  </g>
  <g>
    <rect x="920" y="388" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1020" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">system_settings</text>
    <text x="1020" y="428" text-anchor="middle" font-size="10" fill="#475569">config without code change</text>
  </g>
  <g>
    <rect x="920" y="468" width="200" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="1020" y="490" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">gpa_summaries</text>
    <text x="1020" y="508" text-anchor="middle" font-size="10" fill="#475569">cached per semester</text>
  </g>

  <!-- edges (simple lines) -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <!-- academic chain -->
    <line x1="330" y1="222" x2="330" y2="190"/>
    <line x1="330" y1="306" x2="330" y2="274"/>
    <line x1="330" y1="558" x2="330" y2="526"/>
    <line x1="330" y1="474" x2="330" y2="442"/>
    <line x1="330" y1="648" x2="330" y2="616"/>
    <!-- dept -> programs already; dept -> employees -->
    <line x1="470" y1="160" x2="410" y2="160"/>
    <!-- employee children -->
    <line x1="555" y1="228" x2="555" y2="202"/>
    <line x1="555" y1="288" x2="555" y2="272"/>
    <line x1="555" y1="348" x2="555" y2="332"/>
    <line x1="555" y1="408" x2="555" y2="392"/>
    <!-- students/grading chain -->
    <line x1="775" y1="212" x2="775" y2="188"/>
    <line x1="775" y1="288" x2="775" y2="264"/>
    <line x1="775" y1="364" x2="775" y2="340"/>
    <line x1="775" y1="448" x2="775" y2="424"/>
    <!-- enrollment -> section -->
    <line x1="690" y1="238" x2="410" y2="584"/>
    <!-- grade uses scale/components/rules -->
    <line x1="775" y1="530" x2="775" y2="424"/>
    <line x1="775" y1="588" x2="810" y2="424"/>
    <line x1="775" y1="646" x2="825" y2="424"/>
    <!-- users -> roles -->
    <line x1="190" y1="163" x2="250" y2="160"/>
    <line x1="115" y1="404" x2="115" y2="196"/>
    <line x1="115" y1="470" x2="115" y2="368"/>
    <line x1="190" y1="559" x2="190" y2="559"/>
  </g>

  <text x="590" y="740" text-anchor="middle" font-size="12" fill="#64748b">Not every column or link is drawn — this is the map, not the full schema. The precise schema is defined in Prisma during Phase 1.</text>
  <text x="590" y="762" text-anchor="middle" font-size="12" fill="#64748b">Every table also carries: id (UUID), created_at, updated_at, created_by, updated_by, deleted_at (soft delete), and version where editable.</text>
</svg>
